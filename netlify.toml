[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Funciones serverless (backend para la IA). Despliegan con cada push.
# La GEMINI_API_KEY se define en Netlify → Site settings → Environment variables.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad (defensa en profundidad).
# La CSP permite los orígenes que la app necesita: Google Maps (SDK, tiles,
# fotos de Places) y Supabase (REST/Realtime/Storage). Ajusta *.supabase.co si
# usas un dominio propio.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com https://*.googleusercontent.com https://*.google.com https://placehold.co; connect-src 'self' https://maps.googleapis.com https://places.googleapis.com https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://*.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'"
